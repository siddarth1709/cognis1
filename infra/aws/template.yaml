AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Cognis AWS runtime: API Gateway -> Lambda -> Step Functions -> repository
  observation -> existing Cognis backend -> persistence.

Parameters:
  CognisModelId:
    Type: String
    Default: anthropic.claude-sonnet-4-6
    Description: Bedrock model or inference profile ID enabled in this AWS account/region.

  CognisAutonomyThreshold:
    Type: Number
    Default: 0.75
    MinValue: 0
    MaxValue: 1
    Description: Default confidence threshold passed to the existing Cognis orchestrator.

  CognisApiKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Server-to-server key required by the Cognis dashboard when calling this API.

Globals:
  Function:
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 60
    Tracing: Active
    Environment:
      Variables:
        COGNIS_MODEL_ID: !Ref CognisModelId
        DEFAULT_AUTONOMY_THRESHOLD: !Ref CognisAutonomyThreshold
        COGNIS_API_KEY: !Ref CognisApiKey

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireInvestigationArtifacts
            Status: Enabled
            ExpirationInDays: 14

  PublishedDocsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  PublishedDocsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub cognis-published-docs-${AWS::StackName}
        Description: CloudFront-only access to Cognis publication-gate documents.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PublishedDocsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Cognis live documentation for ${AWS::StackName}
        Origins:
          - Id: PublishedDocsS3Origin
            DomainName: !GetAtt PublishedDocsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt PublishedDocsOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: PublishedDocsS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        PriceClass: PriceClass_100

  PublishedDocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PublishedDocsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${PublishedDocsBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PublishedDocsDistribution}

  InvestigationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: investigation_id
          AttributeType: S
      KeySchema:
        - AttributeName: investigation_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ContractsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: contract_id
          AttributeType: S
      KeySchema:
        - AttributeName: contract_id
          KeyType: HASH

  EvidenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: contract_id
          AttributeType: S
        - AttributeName: evidence_id
          AttributeType: S
      KeySchema:
        - AttributeName: contract_id
          KeyType: HASH
        - AttributeName: evidence_id
          KeyType: RANGE

  InvestigationTraceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: investigation_id
          AttributeType: S
        - AttributeName: step_index
          AttributeType: N
      KeySchema:
        - AttributeName: investigation_id
          KeyType: HASH
        - AttributeName: step_index
          KeyType: RANGE

  AutonomyConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: repo_id
          AttributeType: S
      KeySchema:
        - AttributeName: repo_id
          KeyType: HASH

  DriftLedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: drift_class
          AttributeType: S
        - AttributeName: contract_id
          AttributeType: S
      KeySchema:
        - AttributeName: drift_class
          KeyType: HASH
        - AttributeName: contract_id
          KeyType: RANGE

  PublishedDocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_id
          AttributeType: S
        - AttributeName: repository_key
          AttributeType: S
        - AttributeName: published_at
          AttributeType: N
      KeySchema:
        - AttributeName: document_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: repository-published-at
          KeySchema:
            - AttributeName: repository_key
              KeyType: HASH
            - AttributeName: published_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ObserveFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/observe/
      Handler: app.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ArtifactBucket
      Environment:
        Variables:
          ARTIFACT_BUCKET: !Ref ArtifactBucket

  EngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      Timeout: 900
      MemorySize: 2048
      EphemeralStorage:
        Size: 10240
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ArtifactBucket
        - S3WritePolicy:
            BucketName: !Ref ArtifactBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
      Environment:
        Variables:
          ARTIFACT_BUCKET: !Ref ArtifactBucket
          COGNIS_MODEL_ID: !Ref CognisModelId
          DEFAULT_AUTONOMY_THRESHOLD: !Ref CognisAutonomyThreshold
    Metadata:
      Dockerfile: infra/aws/functions/engine/Dockerfile
      DockerContext: ../../
      DockerTag: latest

  PersistFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/persist/
      Handler: app.handler
      Timeout: 60
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ArtifactBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref InvestigationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PublishedDocumentsTable
        - S3WritePolicy:
            BucketName: !Ref PublishedDocsBucket
      Environment:
        Variables:
          INVESTIGATIONS_TABLE: !Ref InvestigationsTable
          PUBLISHED_DOCUMENTS_TABLE: !Ref PublishedDocumentsTable
          PUBLISHED_DOCS_BUCKET: !Ref PublishedDocsBucket
          PUBLISHED_DOCS_CLOUDFRONT_URL: !Sub https://${PublishedDocsDistribution.DomainName}

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/status/
      Handler: app.handler
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvestigationsTable
        - S3ReadPolicy:
            BucketName: !Ref ArtifactBucket
      Environment:
        Variables:
          INVESTIGATIONS_TABLE: !Ref InvestigationsTable
          PUBLISHED_DOCS_CLOUDFRONT_URL: !Sub https://${PublishedDocsDistribution.DomainName}

  InvestigationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub cognis-investigation-${AWS::StackName}
      Type: STANDARD
      DefinitionUri: statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        ObserveFunctionArn: !GetAtt ObserveFunction.Arn
        EngineFunctionArn: !GetAtt EngineFunction.Arn
        PersistFunctionArn: !GetAtt PersistFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ObserveFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref EngineFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PersistFunction

  CognisHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
        AllowOrigins:
          - '*'

  StartInvestigationRoute:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      FunctionName: !Sub cognis-http-ingress-${AWS::StackName}
      CodeUri: functions/ingress/
      Handler: app.handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref InvestigationStateMachine
        - DynamoDBCrudPolicy:
            TableName: !Ref InvestigationsTable
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref InvestigationStateMachine
          INVESTIGATIONS_TABLE: !Ref InvestigationsTable
          DEFAULT_AUTONOMY_THRESHOLD: !Ref CognisAutonomyThreshold
      Events:
        StartInvestigation:
          Type: HttpApi
          Properties:
            ApiId: !Ref CognisHttpApi
            Path: /v1/investigations
            Method: POST

  GetInvestigationRoute:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      FunctionName: !Sub cognis-http-status-${AWS::StackName}
      CodeUri: functions/status/
      Handler: app.handler
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvestigationsTable
        - S3ReadPolicy:
            BucketName: !Ref ArtifactBucket
      Environment:
        Variables:
          INVESTIGATIONS_TABLE: !Ref InvestigationsTable
          PUBLISHED_DOCS_CLOUDFRONT_URL: !Sub https://${PublishedDocsDistribution.DomainName}
      Events:
        GetInvestigation:
          Type: HttpApi
          Properties:
            ApiId: !Ref CognisHttpApi
            Path: /v1/investigations/{investigation_id}
            Method: GET

Outputs:
  ApiUrl:
    Description: Cognis HTTP API base URL.
    Value: !Sub https://${CognisHttpApi}.execute-api.${AWS::Region}.amazonaws.com

  InvestigationEndpoint:
    Description: Start a Cognis investigation.
    Value: !Sub https://${CognisHttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1/investigations

  StatusEndpointTemplate:
    Description: Get investigation status/result.
    Value: !Sub https://${CognisHttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1/investigations/{investigation_id}

  StateMachineArn:
    Description: Cognis investigation Step Functions state machine.
    Value: !Ref InvestigationStateMachine

  ArtifactBucketName:
    Description: S3 bucket holding repository and investigation artifacts.
    Value: !Ref ArtifactBucket

  PublishedDocumentsBucketName:
    Description: Private S3 origin for publication-gate documents.
    Value: !Ref PublishedDocsBucket

  PublishedDocumentsUrl:
    Description: CloudFront base URL for Cognis live documents.
    Value: !Sub https://${PublishedDocsDistribution.DomainName}
